name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm ci --prefix cli

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:cli

      # Build metadata for GET /version. Values must not contain ":" (wrangler
      # splits --var on the first one), so only the run id is passed and the
      # Worker builds the URL.
      - run: >-
          npx wrangler deploy
          --var GIT_SHA:${{ github.sha }}
          --var GIT_REF:${{ github.ref_name }}
          --var BUILD_RUN:${{ github.run_id }}
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
