name = "htmldrop"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "htmldrop-pages"

# The site's typeface (Geist, SIL OFL; see src/fonts/OFL.txt) and the PNG
# icons (src/icons/), served from the Worker so the pages' default-src 'self'
# covers them.
[[rules]]
type = "Data"
globs = ["**/*.woff2", "**/*.png"]
fallthrough = false

[[routes]]
pattern = "baseurl.ai"
custom_domain = true

# Daily sweep of expired pages and orphaned comments (src/cleanup.ts).
[triggers]
crons = ["17 3 * * *"]
